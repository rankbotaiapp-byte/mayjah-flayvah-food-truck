<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookings — Admin</title>
  <script src="config.js"></script>
  <style>
    :root { --accent: #F4A300; --bg: #0A0A0A; --panel: #1a1a1a; --line: rgba(255,255,255,.1); }
    * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: #fff; padding: 1rem; min-height: 100vh; }
    header { text-align: center; padding: 1.5rem 0; }
    header h1 { font-size: 1.5rem; color: var(--accent); }
    header p { opacity: .6; font-size: .85rem; margin-top: .3rem; }
    .refresh { display: block; margin: 0 auto 1.5rem; background: var(--accent); color: #000; border: none; padding: .7rem 1.5rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .booking { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.2rem; margin-bottom: .8rem; max-width: 600px; margin-left: auto; margin-right: auto; }
    .booking .name { font-size: 1.1rem; font-weight: 700; color: var(--accent); }
    .booking .row { display: flex; justify-content: space-between; margin-top: .5rem; font-size: .9rem; gap: .5rem; }
    .booking .label { opacity: .5; flex-shrink: 0; }
    .booking .msg { text-align: right; }
    .booking .time { color: #4ade80; font-weight: 600; }
    .booking a { color: #fff; text-decoration: none; }
    .booking .source { font-size: .72rem; opacity: .5; text-transform: uppercase; margin-top: .5rem; }
    .empty { text-align: center; opacity: .5; padding: 3rem 1rem; }
    .count { text-align: center; opacity: .6; margin-bottom: 1rem; font-size: .85rem; }

    /* Login gate */
    #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 999; flex-direction: column; gap: 1rem; }
    #gate input { padding: .9rem 1rem; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: #fff; font-size: 1rem; width: 240px; text-align: center; }
    #gate button { background: var(--accent); color: #000; border: none; padding: .8rem 1.6rem; border-radius: 8px; font-weight: bold; cursor: pointer; }
    #gate .err { color: #ff6b6b; font-size: .85rem; height: 1rem; }
    #app { display: none; }
  </style>
</head>
<body>
  <div id="gate">
    <h2>🔒 Owner Login</h2>
    <input type="password" id="gatePw" placeholder="Enter password" autocomplete="off" />
    <button onclick="checkPassword()">Enter</button>
    <div class="err" id="gateErr"></div>
  </div>

  <div id="app">
    <header>
      <h1>📅 Bookings Dashboard</h1>
      <p>New Era Apps · AXIOM</p>
    </header>
    <button class="refresh" onclick="loadBookings()">↻ Refresh</button>
    <div class="count" id="count"></div>
    <div id="list"><div class="empty">Loading bookings…</div></div>
  </div>

  <script>
    const cfg = window.APP_CONFIG || {};

    if (cfg.admin) {
      document.querySelector("header h1").textContent = "📅 " + (cfg.admin.title || "Bookings");
      document.querySelector("header p").textContent = cfg.admin.subtitle || "";
    }
    if (cfg.branding?.accent) {
      document.documentElement.style.setProperty("--accent", cfg.branding.accent);
    }

    // ---- Simple password gate ----
    function checkPassword() {
      const entered = document.getElementById("gatePw").value;
      const correct = cfg.admin?.password || "changeme";
      if (entered === correct) {
        document.getElementById("gate").style.display = "none";
        document.getElementById("app").style.display = "block";
        loadBookings();
      } else {
        document.getElementById("gateErr").textContent = "Incorrect password.";
      }
    }
    document.getElementById("gatePw").addEventListener("keydown", e => {
      if (e.key === "Enter") checkPassword();
    });

    // ---- Load bookings from Supabase ----
    const SUPABASE_URL = "https://ipnmgmzihndtgufxwkuh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_iZVME-itegalWU6HyO50MA_5vkhSDSi";

    async function loadBookings() {
      const list = document.getElementById("list");
      const count = document.getElementById("count");
      list.innerHTML = '<div class="empty">Loading…</div>';
      try {
        const bizId = cfg.meta?.leadId || "";
        const url = `${SUPABASE_URL}/rest/v1/orders?business_id=eq.${encodeURIComponent(bizId)}&order=created_at.desc`;
        const res = await fetch(url, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });
        if (!res.ok) throw new Error("Request failed: " + res.status);
        const rows = await res.json();

        if (!rows.length) {
          list.innerHTML = '<div class="empty">No bookings yet.</div>';
          count.textContent = "";
          return;
        }
        count.textContent = rows.length + " booking" + (rows.length === 1 ? "" : "s");
        list.innerHTML = "";
        rows.forEach(b => {
          const d = b.created_at ? new Date(b.created_at).toLocaleString() : "";
          list.innerHTML += `
            <div class="booking">
              <div class="name">${b.customer_name || "Unknown"}</div>
              <div class="row"><span class="label">Message</span><span class="msg">${b.message || "—"}</span></div>
              <div class="row"><span class="label">Phone</span><a href="tel:${b.phone}">${b.phone || "—"}</a></div>
              <div class="row"><span class="label">Booked</span><span class="time">${d}</span></div>
              <div class="source">${b.source || ""}</div>
            </div>`;
        });
      } catch (e) {
        list.innerHTML = '<div class="empty">Error loading bookings: ' + e.message + '</div>';
      }
    }
  </script>
</body>
</html>
